name: Bug report
description: A control, display mode, or part of the app isn't working as expected.
body:
  - type: input
    id: version
    attributes:
      label: App and macOS versions
      placeholder: Monitor Bar 0.1.3, macOS 26.5
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Monitor and connection
      description: Mac model, monitor model if known, and any cable, dock, adapter, or KVM in between. No serial numbers needed.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include steps to reproduce, expected behavior, and what you saw. For calibration problems, list a few slider values and their effect.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Optional diagnostics
      description: Review reports before attaching them. Remove display serials, identifying raw EDID, and private registry paths. Do not include credentials or unrelated logs.
